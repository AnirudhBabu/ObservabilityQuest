route:
  receiver: "default"
  group_by: ["alertname", "slo"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - match:
        severity: page
      receiver: "page"
      repeat_interval: 30m
    - match:
        severity: ticket
      receiver: "ticket"

receivers:
  - name: "default"
  - name: "page"
    # Swap for a real webhook (PagerDuty/Opsgenie/Slack) in production.
    webhook_configs:
      - url: "http://host.docker.internal:9999/page"
        send_resolved: true
  - name: "ticket"
    webhook_configs:
      - url: "http://host.docker.internal:9999/ticket"
        send_resolved: true

inhibit_rules:
  # A fast-burn page implies the slower-burn signal is also true --
  # no need to double-notify on the same underlying SLO.
  - source_matchers: ["severity=page"]
    target_matchers: ["severity=ticket"]
    equal: ["slo"]
